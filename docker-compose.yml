services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: gambutops
      POSTGRES_USER: gambutops
      POSTGRES_PASSWORD: gambutops
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gambutops -d gambutops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gambutops_postgres:/var/lib/postgresql/data

volumes:
  gambutops_postgres:

